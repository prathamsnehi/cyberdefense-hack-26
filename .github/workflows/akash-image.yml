name: Akash deployment image
on:
  push:
    branches: ['codex/standalone-dashboard']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/prathamsnehi/albert-ai:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/prathamsnehi/cyberdefense-hack-26
            org.opencontainers.image.description=Albert AI dashboard and agent defense runtime hosted on Akash Network
          cache-from: type=gha
          cache-to: type=gha,mode=max
