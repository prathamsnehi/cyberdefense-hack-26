<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.18" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#FF4F1F" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FF4F1F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0b0b" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b0b0b" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0b0b0b"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect y="380" width="1200" height="250" fill="url(#fade)"/>

  <rect x="80" y="72" width="32" height="3" fill="#FF4F1F"/>
  <text x="128" y="79" font-family="Inter, Arial, sans-serif" font-weight="500" font-size="16" letter-spacing="3.2" fill="#8a8a8a">CYBERDEFENSE HACKATHON #SFTECHWEEK</text>

  <rect x="80" y="166" width="24" height="126" fill="#FF4F1F"/>
  <text x="126" y="292" font-family="Oswald, 'Arial Narrow', sans-serif" font-weight="700" font-size="160" fill="#fafafa">Albert AI</text>

  <text x="80" y="372" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="32" fill="#a3a3a3">
    <tspan x="80" dy="0">One malicious email can take control of an AI agent</tspan>
    <tspan x="80" dy="44">with access to email, code and money.</tspan>
    <tspan x="80" dy="44" fill="#fafafa" font-weight="600">Albert AI closes the loop.</tspan>
  </text>

  <rect x="80" y="528" width="1040" height="1" fill="#ffffff" fill-opacity="0.08"/>
  <rect x="80" y="528" width="96" height="2" fill="#FF4F1F"/>

  <text x="80" y="576" font-family="Oswald, 'Arial Narrow', sans-serif" font-weight="600" font-size="26" letter-spacing="3" fill="#fafafa">
    <tspan>PREVENT</tspan>
    <tspan fill="#FF4F1F"> &gt; </tspan>
    <tspan>DETECT</tspan>
    <tspan fill="#FF4F1F"> &gt; </tspan>
    <tspan>PROVE</tspan>
    <tspan fill="#FF4F1F"> &gt; </tspan>
    <tspan>LEARN</tspan>
    <tspan fill="#FF4F1F"> &gt; </tspan>
    <tspan>WATCH</tspan>
  </text>
</svg>
